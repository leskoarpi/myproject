# Deák Koli — Docker Compose for local development.
#
#     docker compose -f docker-compose.local.yml up -d --build
#
# The server runs ./docker-compose.yml instead, which is written for Dokploy:
# it publishes no host ports (Traefik owns 80/443) and joins Dokploy's
# network. This one publishes port 80 so the app is reachable on localhost.

name: deakkoli

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  POSTGRES_DB: ${POSTGRES_DB:-deakkoli}
  POSTGRES_USER: ${POSTGRES_USER:-deakkoli}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  ALLOW_DESTRUCTIVE_MAINTENANCE: ${ALLOW_DESTRUCTIVE_MAINTENANCE:-false}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deakkoli}
      POSTGRES_USER: ${POSTGRES_USER:-deakkoli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deakkoli} -d ${POSTGRES_DB:-deakkoli}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    # Every continuation line must sit at the *same* indentation as the first:
    # a ">" scalar keeps the newline before any line indented further, which
    # split this in two - gunicorn silently lost its timeout and both log
    # flags, and the orphaned tail ran as a command of its own.
    # "exec" hands PID 1 to gunicorn so stop/restart reaches it, not the shell.
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py seed_reference_data &&
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000 --workers 3 --timeout 60
        --access-logfile - --error-logfile -
    environment: *django-env
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *django-env
    volumes:
      - ./backend:/app
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    # The schedule database lives in a volume, not in /app: /app is the git
    # checkout mounted from the host, and Beat rewriting a tracked file there
    # makes the next "git pull" on the server stop with a conflict over a
    # binary nobody edited.
    command: celery -A config beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    environment: *django-env
    volumes:
      - ./backend:/app
      - celery_data:/var/lib/celery
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  celery_data:
