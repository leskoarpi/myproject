upstream django {
    server web:8000;
}

# Which protocol the *browser* used, not the one that reached this nginx.
#
# Behind Dokploy, Traefik terminates TLS and forwards over plain http, so
# $scheme here is always "http". Overwriting X-Forwarded-Proto with it told
# Django the request was insecure, Django redirected to https, Traefik
# terminated TLS again and handed over http again - an endless redirect.
#
# So: pass through whatever the proxy in front reported, and fall back to
# $scheme only when there is no proxy (local development).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 4m;

    # Security headers. HSTS is set by Django when TLS terminates here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Content-hashed assets (ManifestStaticFilesStorage) never change under a
    # given name, so they can be cached indefinitely.
    location ~* "^/static/(?<hashed_asset>.+\.[0-9a-f]{12}\.[a-zA-Z0-9]+)$" {
        alias /app/staticfiles/$hashed_asset;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else under /static/ keeps its plain name across deploys, so it
    # must revalidate. A long max-age here would strand browsers on stale CSS
    # and JS until it expired.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
