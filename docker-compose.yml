# Deák Koli — Docker Compose for the server (Dokploy).
#
# This is the default file name on purpose: Dokploy looks for
# ./docker-compose.yml, so a deployment needs no path configured and cannot
# accidentally pick up the development stack.
#
# For local development use docker-compose.local.yml instead:
#
#     docker compose -f docker-compose.local.yml up -d --build
#
# The two differ in four ways, all about living behind Dokploy's Traefik
# rather than owning the host:
#
#   1. No top-level "name:" — Dokploy names the project itself.
#   2. nginx uses "expose" instead of "ports". Traefik holds 80 and 443 on the
#      host; publishing them here would collide with it.
#   3. nginx joins the external "dokploy-network" so Traefik can reach it.
#      Add the domain under the service's Domains tab (service: nginx,
#      port: 80) and Dokploy writes the routing labels for you.
#   4. Every service reads "env_file: .env" — the file Dokploy generates from
#      the Environment tab. Without it, variables set in the UI land in that
#      file and never reach the containers.
#
# No service sets container_name: Dokploy's logs and metrics rely on naming
# the containers itself.

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in the Environment tab}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS to your domain}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set DJANGO_CSRF_TRUSTED_ORIGINS to https://your-domain}
  POSTGRES_DB: ${POSTGRES_DB:-deakkoli}
  POSTGRES_USER: ${POSTGRES_USER:-deakkoli}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Environment tab}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  ALLOW_DESTRUCTIVE_MAINTENANCE: ${ALLOW_DESTRUCTIVE_MAINTENANCE:-false}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deakkoli}
      POSTGRES_USER: ${POSTGRES_USER:-deakkoli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Environment tab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deakkoli} -d ${POSTGRES_DB:-deakkoli}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    # migrate, collectstatic and the reference-data seed all run on every
    # start and are idempotent, so a Dokploy redeploy needs no extra step.
    # "exec" hands PID 1 to gunicorn so a redeploy stops it gracefully.
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py seed_reference_data &&
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000 --workers 3 --timeout 60
        --access-logfile - --error-logfile -
    env_file:
      - path: .env
        required: false
    environment: *django-env
    # No source mount: the image already contains the code, built from this
    # repository. Mounting ./backend over /app would make what runs depend on
    # a host directory instead of the image Dokploy just built.
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment: *django-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    # The schedule database goes in a volume rather than /app, which is the
    # git checkout: Beat rewriting a tracked file there would make Dokploy's
    # next pull conflict over a binary nobody edited.
    command: celery -A config beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - path: .env
        required: false
    environment: *django-env
    volumes:
      - celery_data:/var/lib/celery
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    # No host ports: Traefik owns 80/443 and reaches this over the shared
    # network. Attach the domain in Dokploy (service nginx, port 80).
    expose:
      - "80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  celery_data:
