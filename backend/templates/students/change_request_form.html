{% extends "base.html" %}
{% block title %}Változtatási kérelem{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Változtatási kérelem</h1>
  <p class="subtitle">{{ student.full_name }} — csak a megváltoztatott mezők kerülnek be a kérelembe</p></div></div>
<div class="card" style="max-width:640px">
  <form method="post">
    {% csrf_token %}
    {% include "_form.html" %}
    <div class="actions">
      <button class="btn primary" type="submit">Kérelem küldése</button>
      <a class="btn" href="{% url 'students:detail' student_id=student.pk %}">Mégse</a>
    </div>
  </form>
</div>
{% endblock %}
