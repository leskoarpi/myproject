{% extends "base.html" %}
{% block title %}{% if room %}{{ room.number }}{% else %}Új szoba{% endif %}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{% if room %}{{ room.number }}. szoba{% else %}Új szoba{% endif %}</h1></div></div>
<div class="card" style="max-width:480px">
  <form method="post">{% csrf_token %}{% include "_form.html" %}
    <div class="actions"><button class="btn primary" type="submit">Mentés</button>
      <a class="btn" href="{% url 'rooms:list' %}">Mégse</a></div>
  </form>
</div>
{% endblock %}
