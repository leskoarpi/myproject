{% extends "base.html" %}
{% block anon_content %}
<div class="auth-page"><div class="card">
  <h2>Új jelszó</h2>
  {% if validlink %}
    <form method="post">{% csrf_token %}
      {% for field in form %}
        <div class="field"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
      {% endfor %}
      <button class="btn primary" type="submit">Mentés</button>
    </form>
  {% else %}
    <div class="message error">Ez a link már nem érvényes. Kérj újat.</div>
    <a class="btn" href="{% url 'accounts:password_reset' %}">Új link kérése</a>
  {% endif %}
</div></div>
{% endblock %}
