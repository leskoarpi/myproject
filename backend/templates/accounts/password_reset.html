{% extends "base.html" %}
{% block title %}Jelszó helyreállítás{% endblock %}
{% block anon_content %}
<div class="auth-page">
  <div class="card">
    <h2>Jelszó helyreállítás</h2>
    <p class="small muted">Add meg az e-mail címed, és küldünk egy helyreállító linket.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field"><label>E-mail</label>{{ form.email }}{{ form.email.errors }}</div>
      <button class="btn primary" type="submit">Küldés</button>
      <a class="btn" href="{% url 'accounts:login' %}">Vissza</a>
    </form>
  </div>
</div>
{% endblock %}
